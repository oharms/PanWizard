<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" font-family="'Gabarito','Segoe UI','Helvetica Neue',Arial,sans-serif">
  <title>Local offload: Claude plans each task, a model on your own machine writes the code, Claude reviews, re-runs the tests and commits with a measured label of who wrote each line</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B4BE6"/>
    </marker>
  </defs>
  <rect width="980" height="370" rx="18" fill="#FBF7EE"/>
  <rect x="0.5" y="0.5" width="979" height="369" rx="18" fill="none" stroke="#E7DDC8"/>

  <text x="40" y="44" font-size="17" font-weight="700" fill="#211E18">Claude engineers. Your own machine types.</text>
  <text x="40" y="66" font-size="13.5" fill="#6E685B">With /pan:local on, each task's code is written by a model on your hardware, and every committed line is traced to who wrote it.</text>

  <g font-size="12.5">
    <!-- 1 Claude plans -->
    <g transform="translate(40,92)">
      <rect width="250" height="176" rx="12" fill="#FFFFFF" stroke="#E7DDC8"/>
      <circle cx="22" cy="24" r="10" fill="#5B4BE6"/><text x="22" y="28.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="40" y="29" font-size="15" font-weight="700" fill="#211E18">Claude plans</text>
      <text x="14" y="60" fill="#3A352C">Writes a spec for the task: the goal,</text>
      <text x="14" y="77" fill="#3A352C">the interface, the files it may touch</text>
      <text x="14" y="94" fill="#3A352C">and the command that verifies it.</text>
      <text x="14" y="126" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#C2410C">delegate run --spec …</text>
      <text x="14" y="144" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#C2410C">  --allow src/a.js --verify …</text>
    </g>

    <!-- 2 Your machine writes -->
    <g transform="translate(365,92)">
      <rect width="250" height="176" rx="12" fill="#211E18"/>
      <circle cx="22" cy="24" r="10" fill="#FFCE4A"/><text x="22" y="28.5" font-size="12" font-weight="700" fill="#211E18" text-anchor="middle">2</text>
      <text x="40" y="29" font-size="15" font-weight="700" fill="#FFFFFF">Your machine writes</text>
      <text x="14" y="60" fill="#E7DDC8">Qwen, Llama or any model on Ollama,</text>
      <text x="14" y="77" fill="#E7DDC8">LM Studio, vLLM. Five tools, no shell:</text>
      <text x="14" y="104" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#FFCE4A">list · read · write (allowed</text>
      <text x="14" y="120" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#FFCE4A">files only) · run_verify · finish</text>
      <text x="14" y="150" fill="#E7DDC8">.git, secrets and PAN's own files</text>
      <text x="14" y="166" fill="#E7DDC8">are out of reach.</text>
    </g>

    <!-- 3 Claude checks -->
    <g transform="translate(690,92)">
      <rect width="250" height="176" rx="12" fill="#FFFFFF" stroke="#E7DDC8"/>
      <circle cx="22" cy="24" r="10" fill="#1E8E5A"/><text x="22" y="28.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="40" y="29" font-size="15" font-weight="700" fill="#211E18">Claude checks and commits</text>
      <text x="14" y="60" fill="#3A352C">Reviews the diff, re-runs the tests</text>
      <text x="14" y="77" fill="#3A352C">itself, sends it back with fix notes or</text>
      <text x="14" y="94" fill="#3A352C">takes the task back. Then commits:</text>
      <text x="14" y="126" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#1E8E5A">PAN-Delegated: qwen-coder</text>
      <text x="14" y="144" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#1E8E5A">  (31/31 added lines from</text>
      <text x="14" y="160" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#1E8E5A">  the local model)</text>
    </g>
  </g>

  <!-- arrows -->
  <path d="M292,152 L361,152" stroke="#5B4BE6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="327" y="143" font-size="11" fill="#6E685B" text-anchor="middle">spec</text>
  <path d="M617,152 L686,152" stroke="#5B4BE6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="652" y="143" font-size="11" fill="#6E685B" text-anchor="middle">diff</text>
  <path d="M686,226 L617,226" stroke="#5B4BE6" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="652" y="244" font-size="11" fill="#6E685B" text-anchor="middle">fix notes</text>

  <!-- footer band -->
  <g transform="translate(40,288)">
    <rect width="900" height="58" rx="12" fill="#FFFFFF" stroke="#E7DDC8"/>
    <text x="18" y="24" font-size="12.5" fill="#3A352C"><tspan font-weight="700" fill="#B3261E">Never handed off:</tspan> authentication, payments, cryptography, secrets, security fixes, checkpoints, TDD red steps.</text>
    <text x="18" y="44" font-size="12.5" fill="#3A352C"><tspan font-weight="700" fill="#5B4BE6">On the record:</tspan> every run's raw replies and files are saved in .planning/delegations/; the label is measured, not claimed.</text>
  </g>
</svg>
