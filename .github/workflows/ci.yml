name: CI

# macOS only. Every other gate runs on the owner's machine: `npm run ci:local`
# (scripts/local-ci.cjs) runs the suite on Windows under Node 18, 20 and 22 and on Linux in
# node:*-bookworm containers, the harness at tier 0, gitleaks, npm audit, the links check,
# the surface registry, the coverage gate and a clean-tree check, and `npm run land` lands a
# branch only after it passed (docs/DEVELOPMENT.md, Local CI). There is no Mac there, and the
# macOS jobs have caught a real bug the others missed (an 8 KB stdout truncation, PR #52), so
# they stay here.
#
# Hardening notes:
#   - Top-level permissions default to read-only.
#   - Third-party actions are pinned by full commit SHA (not by tag) to defeat
#     tag-substitution attacks. Comments next to each SHA give the human version
#     tag at time of pinning — update both together when bumping.
#   - `npm ci` is used (not `npm install`) so package-lock.json is the source of
#     truth and unexpected dep drift fails the build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        node: [18, 20, 22]

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Build hooks
        run: npm run build:hooks

      - name: Unit tests
        run: npm test

      - name: Scenario tests
        run: npm run test:scenarios
