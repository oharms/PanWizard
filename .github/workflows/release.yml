name: Release

# Publish to npm when a `v*` tag is pushed.
#
# How to ship a release (full flow: docs/DEVELOPMENT.md → Release Process):
#   1. Bump `version` in package.json and in .github/plugin/marketplace.json;
#      turn CHANGELOG's [Unreleased] into the version heading.
#   2. Commit as `release(x.y.z): summary` on a release/vx.y.z branch, open a
#      PR to main and merge once the required checks are green.
#   3. Tag the merge commit: `git tag vx.y.z`.
#   4. Push the tag BY EXPLICIT REFSPEC: `git push origin refs/tags/vx.y.z`.
#      `git push --follow-tags` silently drops the tag in this repo —
#      remote.origin.push is pinned to main — and then nothing publishes
#      (this stalled v3.26.0 on 2026-08-16).
#   5. Watch this workflow run. It publishes to npm AND creates the GitHub
#      Release from the CHANGELOG section for that version. Done.
#
# Security properties:
#   - No long-lived token anywhere — OIDC mints a short-lived credential per run.
#   - `--provenance` cryptographically signs that the tarball was built by THIS
#     workflow run. Anyone can verify with `npm view pan-wizard --json` and the
#     sigstore signature visible on https://www.npmjs.com/package/pan-wizard.
#   - Two elevated permissions, both needed and both scoped to this job:
#     `id-token: write` for sigstore provenance, and `contents: write` for the
#     GitHub Release (it writes a release object against the tag that triggered
#     the run — no branch or file is touched). Pinned action SHAs prevent
#     tag-substitution.
#   - The version-tag must match `package.json` — drift fails the build before
#     anything is uploaded.
#
# Prerequisite (one-time):
#   - Tokenless via OIDC trusted publishing — no NPM_TOKEN secret. On
#     npmjs.com → the `pan-wizard` package → Settings → Trusted Publishing,
#     add a GitHub Actions publisher: organization/user `oharms`, repository
#     `PanWizard`, workflow filename `release.yml`, allowed action `npm
#     publish` (leave Environment blank). `npm publish` then exchanges the
#     runner's OIDC id-token for a short-lived credential — nothing to
#     rotate, no 2FA. Requires npm >= 11.5.1 (upgraded in a step below).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      # Required for npm provenance — gives the runner a short-lived OIDC token
      # that sigstore exchanges for a signing certificate.
      id-token: write
      # For the GitHub Release created after a successful publish. The release is
      # written against the tag that triggered this run; nothing else is writable.
      contents: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Full history for `git describe` and any version-tag traceability.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing (OIDC needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        # Catches the "tagged v3.8.1 but forgot to bump package.json" footgun
        # BEFORE anything is uploaded.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "Tag: v$TAG  ·  package.json: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Build hooks
        run: npm run build:hooks

      - name: Publish with provenance (OIDC)
        # prepublishOnly hook reruns release-check.js before upload; if any gate
        # fails the publish aborts and nothing is uploaded.
        run: npm publish --provenance --access public

      # Housekeeping AFTER a successful publish. Keeps the newest 3 stable
      # releases installable-without-warning and deprecates everything older, plus
      # any prerelease the new release supersedes.
      #
      # `continue-on-error` is deliberate and load-bearing: the package is already
      # published by this point. A failure here means an old version stayed
      # undeprecated — a cosmetic omission. Letting that mark the release red would
      # claim the publish failed, which is false and strictly worse.
      #
      # NOTE ON AUTH: this job publishes via OIDC trusted publishing, whose token is
      # scoped to publishing. `npm deprecate` is a different operation and may be
      # refused with E401/E403. If it is, the step logs the refusal and the release
      # still passes — see the script's own failure handling. To make it work,
      # supply a granular automation token with write access as NPM_TOKEN; the
      # script needs no change.
      - name: Deprecate superseded versions
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/deprecate-old-versions.js --apply

      # The GitHub Release. Until 2026-09-17 this workflow published to npm and
      # stopped, so nine tagged versions (3.20.0-3.22.0, 3.24.0-3.28.0) have a tag and
      # an npm release but no release object — a gap nobody noticed because nothing
      # asserted it. The tag, the npm publish and the Release now move together.
      #
      # Notes come from the CHANGELOG section for this exact version, so the release
      # page says what the version changed rather than a generated commit list. A
      # version with no section gets a short pointer instead of an empty release.
      #
      # `continue-on-error` for the same reason as the deprecate step above: the
      # package is already published by this point, and a missing release object is a
      # cosmetic omission. Marking the run red would claim the publish failed, which
      # would be false. The Summary step below reports whether the release exists, so
      # the omission is visible instead of silent.
      - name: Create the GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          NOTES=$(mktemp)
          {
            echo "Published to npm as [pan-wizard@$VERSION](https://www.npmjs.com/package/pan-wizard/v/$VERSION) with SLSA provenance."
            echo ""
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { f = 1; next }
              f && /^## \[/ { exit }
              f { print }
            ' CHANGELOG.md
          } > "$NOTES"
          if [ "$(wc -l < "$NOTES")" -le 3 ]; then
            echo "::warning::no CHANGELOG section for $VERSION — publishing a pointer instead"
            printf '\nSee [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md).\n' "$GITHUB_REPOSITORY" >> "$NOTES"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it alone."
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --verify-tag
          fi

      - name: Summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            RELEASE="- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          else
            RELEASE="- Release: **NOT created** — the npm publish succeeded; create it by hand with \`gh release create v$VERSION\`."
          fi
          {
            echo "## Published \`pan-wizard@$VERSION\` :rocket:"
            echo ""
            echo "- Tarball: https://registry.npmjs.org/pan-wizard/-/pan-wizard-$VERSION.tgz"
            echo "- Page: https://www.npmjs.com/package/pan-wizard/v/$VERSION"
            echo "- Provenance: visible on the package page (sigstore signature)."
            echo "$RELEASE"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
